# Puerto del servidor (Railway inyecta la variable PORT automáticamente)
server.port=${PORT:8080}

# Desactivar Spring Cloud Config Server
spring.cloud.config.enabled=false

# Nombre de la aplicación
spring.application.name=prueba

# Base de datos PostgreSQL (Neon). Credenciales SOLO por variables de entorno (ver README, seccion Secretos)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-wild-voice-ae85w8fa-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# URL y credenciales de GestoPago (secretos por variables de entorno)
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO}
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD}
gestopago.auth.refresh-rate-ms=3600000
gestopago.api-key=${GESTOPAGO_API_KEY:YSX1HpAFum4TpCecyFBxs4eIjAlbhKqK6fpcSQp8}

# Configuración de Servicios de Productos y Transacciones GestoPago
gestopago.service.url=https://gestopago.portalventas.net
gestopago.service.connect-timeout-ms=10000
gestopago.service.read-timeout-ms=65000
gestopago.service.unidad=083

# Timeouts reales del cliente Feign hacia GestoPago. Sin reintentos automaticos en operaciones financieras
# (Spring Cloud OpenFeign usa Retryer.NEVER_RETRY por defecto): un timeout nunca se reintenta a ciegas.
spring.cloud.openfeign.client.config.gestoPagoProductClient.connect-timeout=${gestopago.service.connect-timeout-ms}
spring.cloud.openfeign.client.config.gestoPagoProductClient.read-timeout=${gestopago.service.read-timeout-ms}

# Configuración de Cifrado AES-256-CBC GestoPago (secretos por variables de entorno)
gestopago.aes.secret-key=${GESTOPAGO_AES_SECRET_KEY}
gestopago.aes.iv=${GESTOPAGO_AES_IV}

# Reglas del flujo de pagos
# Rango permitido para productos de monto abierto (precio 0 o nulo en el catalogo)
gestopago.pago.monto-minimo=1.00
gestopago.pago.monto-maximo=10000.00
# Ventana en la que una operacion identica (misma cuenta/producto/monto/telefono/referencia) se considera duplicada
gestopago.pago.ventana-duplicados-segundos=120

# Conciliacion de pagos con resultado desconocido (timeout, 5xx, respuesta ilegible)
gestopago.conciliacion.habilitada=true
gestopago.conciliacion.intervalo-ms=120000
gestopago.conciliacion.espera-minutos=2
gestopago.conciliacion.max-intentos=5
# Reconsulta reutilizando el MISMO UPC; desactivar si el proveedor no garantiza idempotencia por UPC
gestopago.conciliacion.reintento-habilitado=true

# -------------------------------------------------------------
# Configuración de Redis
# -------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms

# Clave donde se guardará el catálogo en Redis
gestopago.redis.catalogo-key=gestopago:catalogo:productos_por_tipo_front

# Tiempo de vida en Redis: 90000 segundos (25 horas para cubrir hasta el siguiente cron)
gestopago.redis.catalogo-ttl-seconds=90000

# -------------------------------------------------------------
# Configuración del Cron
# -------------------------------------------------------------
# Expresión cron para las 6:00 AM todos los días (segundo, minuto, hora, día, mes, día-semana)
gestopago.cron.catalogo=0 0 6 * * *
gestopago.cron.zone=America/Mexico_City

# Jackson: Mantener precision y escala exacta de decimales
spring.jackson.deserialization.use-big-decimal-for-floats=true

# -------------------------------------------------------------
# Configuración de Notificaciones por Correo (Brevo / Sendinblue)
# -------------------------------------------------------------
brevo.api.url=https://api.brevo.com
brevo.api.key=${BREVO_API_KEY}
brevo.sender.name=Comprobante de Pago Digital
brevo.sender.email=zahir.rodriguez.per@gmail.com
