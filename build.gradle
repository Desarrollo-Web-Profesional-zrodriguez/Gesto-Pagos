plugins {
    id 'jacoco'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'org.springframework.boot' version '3.3.6'//Versión de componentes de spring boot
    id 'org.sonarqube' version '7.5.0.8588'
    id "org.owasp.dependencycheck" version "8.1.2"
    id 'com.github.ben-manes.versions' version '0.46.0'
    id 'java'
}

group = 'com.proyecto.servicio'
version = '1.0'

ext {
    set('lombok.version', '1.18.48')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}


dependencies {
    //Spring Framework
    implementation 'org.springframework.cloud:spring-cloud-config-client:4.1.4'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.4'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-freemarker'
    //Documentation y APIs

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0' //RevisarCompatibilidad
    //Bases de datos
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'com.oracle.database.jdbc:ojdbc8:23.2.0.0'
    implementation 'com.oracle.database.jdbc:ucp:23.2.0.0'
    // implementation 'org.hibernate:hibernate-core:6.2.7.Final'
    implementation 'org.hibernate:hibernate-core:6.5.3.Final'
    implementation 'io.lettuce:lettuce-core:6.5.1.RELEASE'
    //Seguridad
    //implementation 'io.jsonwebtoken:jjwt:0.9.1'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'com.auth0:jwks-rsa:0.22.1'
    implementation 'com.auth0:java-jwt:4.4.0'
    //Utilerias Apache Commons
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'commons-fileupload:commons-fileupload:1.5'
    implementation 'commons-io:commons-io:2.18.0'
    //implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.1'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    //Serialización
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.json:json:20231013'
    //Utilerias Google
    implementation 'com.google.api-client:google-api-client:2.7.1'
    implementation 'com.google.api-client:google-api-client-jackson2:2.7.1'
    //Mail-XML
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.3'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    //Soporte adicional  herramientas de desarrollo
    implementation 'org.apache.opennlp:opennlp-tools:2.2.0'
    implementation 'org.projectlombok:lombok:1.18.48'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-inline:5.1.1'
    testImplementation 'com.h2database:h2:2.2.220'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'


}

configurations.all {
    exclude group: "org.apache.logging.log4j", module: "log4j-api"
    exclude group: "org.apache.logging.log4j", module: "log4j-to-slf4j"
    exclude group: "log4j", module: "log4j"
}

test {
    useJUnitPlatform()
}

springBoot {
    buildInfo {
    }
}

bootRun {
    systemProperty 'java.net.preferIPv4Stack', 'true'
}

sonar {
    properties {
        property "sonar.coverage.exclusions", "**/App.java,**/client/**,**/controller/**,**/cron/**,**/entity/**,**/exception/**,**/mapper/**,**/model/**,**/repositorys/**,**/util/**,**/validation/**,**/service/cliente/util/**"
        property "sonar.issue.ignore.multicriteria", "e1,e2,e3,e4,e5"
        property "sonar.issue.ignore.multicriteria.e1.ruleKey", "java:S3329"
        property "sonar.issue.ignore.multicriteria.e1.resourceKey", "**/AesEncryption.java"
        property "sonar.issue.ignore.multicriteria.e2.ruleKey", "java:S5542"
        property "sonar.issue.ignore.multicriteria.e2.resourceKey", "**/AesEncryption.java"
        property "sonar.issue.ignore.multicriteria.e3.ruleKey", "java:S6432"
        property "sonar.issue.ignore.multicriteria.e3.resourceKey", "**/AesEncryption.java"
        property "sonar.issue.ignore.multicriteria.e4.ruleKey", "java:S120"
        property "sonar.issue.ignore.multicriteria.e4.resourceKey", "**"
        property "sonar.issue.ignore.multicriteria.e5.ruleKey", "java:S5778"
        property "sonar.issue.ignore.multicriteria.e5.resourceKey", "**/src/test/**"
    }
}
jacocoTestReport {
    reports {
        xml.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, include: [
                '**/config/**',
                '**/service/**'
            ], exclude: [
                '**/service/cliente/util/**'
            ])
        }))
    }
}

//ejecutar applicación dentro de contenedor
//sh gradlew clean build dockerImage dockerUp
/**
 * Genera imagen
 */
task dockerImage(type: Exec) {
    println 'CrearImagen'
    commandLine "docker", "build", "-t", "proyecto-core:0.1", "$projectDir"
}

/**
 * Ejecuta imagen
 */
task dockerUp(type: Exec) {
    println "Arranca imagen"
    commandLine "docker-compose", "--compatibility", "up"
}

dependencyCheck {
    formats = ["JSON", "HTML"]
}